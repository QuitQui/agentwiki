[project]
name = "agentwiki"
version = "0.1.0"
description = "HTML-first project memory compiler for human–AI collaboration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.3.3",
    "jsonschema>=4.0,<4.24",
    "lancedb>=0.21",
    "lxml>=6.1.0",
    "numpy>=1.26",
    "referencing<0.36",
    "rich>=15.0.0",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
agentwiki = "compiler.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["compiler*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
